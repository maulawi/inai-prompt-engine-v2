<style>
:root{
  --maroon:#6E1423;
  --maroon-dark:#4E0D18;
  --cream:#FAF3E8;
  --gold:#C9A24B;
  --ink:#2B1210;
  --blush:#E8D5CE;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--maroon-dark);
  font-family:'Plus Jakarta Sans',sans-serif;
  color:var(--ink);
}
#app{
  max-width:480px;
  margin:0 auto;
  min-height:100vh;
  background:var(--cream);
  position:relative;
  padding-bottom:100px;
  box-shadow:0 0 60px rgba(0,0,0,0.35);
  overflow-x:hidden;
}
.brandbar{
  padding:16px 0 8px;
  text-align:center;
  background:linear-gradient(180deg,var(--maroon) 0%, var(--maroon) 60%, var(--cream) 100%);
  padding-bottom:26px;
  margin-bottom:-16px;
}
.brand{
  font-family:'Fraunces',serif;
  font-size:13px;
  letter-spacing:3px;
  color:var(--gold);
  text-transform:uppercase;
}
.rail{display:flex;justify-content:center;align-items:center;gap:16px;padding:14px 0 4px;}
.rail-step{display:flex;flex-direction:column;align-items:center;gap:5px;}
.diamond{width:11px;height:11px;background:rgba(255,255,255,0.25);transform:rotate(45deg);border:1px solid var(--gold);}
.diamond.filled{background:var(--gold);}
.diamond.current{background:var(--cream);border:2px solid var(--gold);}
.rail-label{font-size:9px;color:rgba(255,255,255,0.75);letter-spacing:.5px;}
.screen{padding:14px 22px 20px;}
.eyebrow{font-size:12px;color:var(--maroon);opacity:.75;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;}
.headline{font-family:'Fraunces',serif;font-size:27px;color:var(--maroon);margin:0 0 8px;line-height:1.25;font-weight:700;}
.subline{font-size:15px;color:var(--ink);opacity:.8;margin-bottom:22px;line-height:1.5;}
.card-grid{display:grid;gap:12px;}
.card-grid.two-col{grid-template-columns:1fr 1fr;}
.card{
  background:#fff;
  border:2px solid var(--blush);
  border-radius:14px;
  padding:16px;
  cursor:pointer;
  transition:.15s;
  text-align:left;
}
.card:active{transform:scale(0.98);}
.card.selected{border-color:var(--maroon);background:#fff6ee;}
.card h3{font-family:'Fraunces',serif;margin:0 0 4px;font-size:17px;color:var(--maroon);font-weight:600;}
.card p{margin:0;font-size:13px;opacity:.75;line-height:1.4;}
.product-thumb{
  width:100%;height:90px;border-radius:10px;margin-bottom:10px;
  display:flex;align-items:center;justify-content:center;
  font-family:'Fraunces',serif;color:#fff;font-size:13px;letter-spacing:1px;
}
.thumb-kuku{background:linear-gradient(135deg,#7A1A2B,#3E0B14);}
.thumb-henna{background:linear-gradient(135deg,#5B1220,#2A0A10);}
.cta-bar{
  position:fixed;bottom:0;left:0;right:0;
  max-width:480px;margin:0 auto;
  background:linear-gradient(to top, var(--cream) 65%, transparent);
  padding:22px 22px 24px;
}
.btn-primary{
  width:100%;background:var(--maroon);color:#fff;border:none;
  padding:16px;border-radius:12px;font-size:16px;font-weight:600;
  font-family:'Plus Jakarta Sans',sans-serif;
}
.btn-primary:disabled{opacity:.35;}
.btn-back{
  background:none;border:none;color:var(--maroon);
  font-size:14px;font-weight:600;padding:6px 0 0;cursor:pointer;
}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:14px 22px 4px;-webkit-overflow-scrolling:touch;}
.tab{
  flex:0 0 auto;padding:9px 15px;border-radius:20px;
  background:var(--blush);font-size:13px;font-weight:600;
  white-space:nowrap;cursor:pointer;color:var(--maroon-dark);
}
.tab.active{background:var(--maroon);color:#fff;}
.prompt-block{
  background:#fff;border:1px solid var(--blush);border-radius:12px;
  padding:14px;margin-bottom:14px;
}
.prompt-title{font-family:'Fraunces',serif;color:var(--maroon);font-size:15px;margin-bottom:4px;font-weight:600;}
.prompt-explain{font-size:13px;opacity:.75;margin-bottom:10px;line-height:1.4;}
.prompt-text{
  font-family:'IBM Plex Mono',monospace;font-size:12px;white-space:pre-wrap;
  background:var(--cream);border-radius:8px;padding:10px;
  max-height:220px;overflow-y:auto;margin:0 0 10px;line-height:1.5;
}
.copy-btn{
  background:var(--gold);border:none;color:var(--maroon-dark);
  padding:9px 16px;border-radius:20px;font-size:13px;font-weight:700;cursor:pointer;
}
.copy-btn.copied{background:var(--maroon);color:#fff;}
.dialogue-preview{background:var(--blush);border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:10px;}
.dialogue-preview b{color:var(--maroon);}
.field{margin-bottom:16px;}
.field label{display:block;font-size:13px;font-weight:600;color:var(--maroon);margin-bottom:6px;}
.field select{
  width:100%;padding:12px;border-radius:10px;border:2px solid var(--blush);
  font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;background:#fff;color:var(--ink);
}
.toggle-row{display:flex;gap:10px;margin-bottom:18px;}
.toggle-btn{
  flex:1;padding:12px;border-radius:10px;border:2px solid var(--blush);
  background:#fff;text-align:center;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink);

.toggle-btn.active{border-color:var(--maroon);background:#fff6ee;color:var(--maroon);}
.breadcrumb{font-size:12px;color:var(--maroon);opacity:.7;margin-bottom:10px;}
.welcome-hero{padding:40px 22px 10px;text-align:center;}
.welcome-hero .headline{font-size:32px;}
.section-note{font-size:12px;color:var(--maroon);opacity:.7;margin:4px 0 16px;font-style:italic;}
</style>
</head>

  {id:"lifestyle", labelMalay:"Lifestyle", descMalay:"Suasana hangat & santai, cahaya semulajadi", mood:"warm, relatable, everyday-premium", lighting:"soft natural window light", camera:"steady handheld, occasional slow push-in"},
  {id:"product_demo", labelMalay:"Product Demo", descMalay:"Fokus jelas kat produk, cahaya terang", mood:"crisp, clear, focused on the product", lighting:"clean, bright, even light", camera:"locked or tripod, close-up macro on product and hands"}
];

/* ==================== DATA: STRUCTURE TEMPLATES (labels only) ==================== */
const STRUCTURE_LABELS = {
  reaction_flow:["Hook","Context","Product/Action","Result/Reaction","Ending"],
  product_demo:["Hero Shot","Prep Produk","Application","Result","Hero Shot"],
  transformation_reveal:["Before","Decision","Process","Transition","Reveal"]
};

/* ==================== DATA: CHARACTER DEFAULT ==================== */
const CHARACTER_DEFAULT = {
  ageRange:"late 20s", appearance:"Malay woman", hairstyle:"shoulder-length, natural hairstyle",
  skinTone:"light-medium", clothing:"casual modern daily wear", makeup:"natural", expression:"calm, warm"
};

const CHAR_OPTIONS = {
  ageRange:["early 20s","late 20s","30s","40s","50s"],
  appearance:["Malay woman","Malay woman (hijab)","Malay man","Chinese woman","Indian woman"],
  clothing:["casual modern daily wear","office attire","traditional baju kurung","evening wear","beautician salon uniform","bridal outfit","content creator casual","university student casual","corporate blazer"]
};

/* ==================== PROMPT TEMPLATE BUILDERS ==================== */
function characterRefText(c){
  return "Reference character: a "+c.ageRange+" "+c.appearance+", "+c.hairstyle+", "+c.skinTone+" skin tone, wearing "+c.clothing+", "+c.makeup+" makeup, "+c.expression+" expression. This exact character must be used consistently in every following image and video.";
}
function productRefText(p){
  return "Product reference: "+p.packagingLock+"\n"+PRODUCT_LOCK_RULE;
}
function styleLine(s){
  return "Style: "+s.mood+", lighting: "+s.lighting+", camera: "+s.camera;
}
function firstSceneImagePrompt(charRef, prodRef, beat1, style){
  return charRef+"\n"+prodRef+"\nScene: "+beat1.action+"\n"+styleLine(style)+"\n"+CHARACTER_LOCK_RULE;
}
function fullSceneReferencePrompt(charRef, prodRef, beats, style){
  const list = beats.map((b,i)=>(i+1)+". "+b.action).join("\n");
  return charRef+"\n"+prodRef+"\nOverall sequence (5 beats, approx 2s each, 10s total):\n"+list+"\n"+styleLine(style)+"\n"+CHARACTER_LOCK_RULE;
}
function sceneImagePrompt(n, charRef, prodRef, beat, style){
  return charRef+"\n"+prodRef+"\nScene "+n+" of 5 - purpose: "+beat.purpose+"\nAction: "+beat.action+"\n"+styleLine(style)+"\n"+CHARACTER_LOCK_RULE;
}
function combinedVideoPrompt(beats, style, character){
  const sceneLines = beats.map(function(b,i){
    let line = "Scene "+(i+1)+" ("+b.purpose+", ~2s): "+b.action+".";
    if(b.dialogue && b.dialogue.hasDialogue){
      line += " The "+b.dialogue.speaker+" says naturally in Malay: "+b.dialogue.lineMalay+".";
    }
    return line;
  }).join("\n");
  return "Subject: character as referenced, product as referenced.\nCreate one continuous 10-second vertical short-form video made of 5 sequential scenes, approximately 2 seconds each:\n"+sceneLines+"\nCamera: "+style.camera+", framing appropriate to a vertical short-form video.\nLighting: "+style.lighting+".\nFacial expression / body movement: natural, consistent with "+character.expression+" expression throughout.\nContinuity: identical character and product appearance across all 5 scenes.\n"+PRODUCT_LOCK_RULE+"\n"+CHARACTER_LOCK_RULE+"\n"+NO_TEXT_RULE;
}

/* ==================== STATE ==================== */
let state = {
  screen:"welcome",
  product:null, angle:null, scenario:null, style:null,
  character: Object.assign({}, CHARACTER_DEFAULT),
  useDefaultCharacter:true,
  activeTab:"idea"
};

const RAIL_STEPS = ["Produk","Sudut","Situasi","Gaya","Watak"];
function railIndexForScreen(){
  return {product:0, angle:1, scenario:2, style:3, character:4}[state.screen];
}

/* ==================== HELPERS ==================== */
function esc(str){
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function anglesForProduct(pid){ return ANGLES.filter(a=>a.productId===pid); }
function scenariosForAngle(aid){ return SCENARIOS.filter(s=>s.angleId===aid); }

function renderRail(){
  const idx = railIndexForScreen();
  if(idx===undefined) return "";
  let html = "<div class='rail'>";
  RAIL_STEPS.forEach((label,i)=>{
    let cls = "diamond";
    if(i<idx) cls += " filled";
    if(i===idx) cls += " current";
    html += "<div class='rail-step'><div class='"+cls+"'></div><div class='rail-label'>"+label+"</div></div>";
  });
  html += "</div>";
  return html;
}
function brandBar(){
  return "<div class='brandbar'><div class='brand'>Inai Republic</div>"+renderRail()+"</div>";
}

/* ==================== SCREEN RENDERERS ==================== */
function renderWelcome(){
  return "<div class='welcome-hero'>"+
    "<div class='eyebrow'>Inai Prompt Engine</div>"+
    "<div class='headline'>Jom Cipta Video AI</div>"+
    "<div class='subline'>Pilih produk, pilih idea dan dapatkan prompt lengkap untuk video marketing anda.</div>"+
    "</div>"+
    "<div class='cta-bar'><button class='btn-primary' onclick='go(\"product\")'>Mula Sekarang</button></div>";
}

function renderProduct(){
  let html = brandBar()+"<div class='screen'>";
  html += "<div class='headline'>Pilih Produk</div><div class='subline'>Produk mana yang anda nak buat content hari ni?</div>";
  html += "<div class='card-grid'>";
  PRODUCTS.forEach(p=>{
    const sel = state.product && state.product.id===p.id ? " selected":"";
    html += "<div class='card"+sel+"' onclick='selectProduct(\""+p.id+"\")'>"+
      "<div class='product-thumb "+p.thumbClass+"'>"+esc(p.nameMalay)+"</div>"+
      "<h3>"+esc(p.nameMalay)+"</h3><p>"+esc(p.descMalay)+"</p></div>";
  });
  html += "</div></div>";
  html += "<div class='cta-bar'><button class='btn-primary' "+(state.product?"":"disabled")+" onclick='go(\"angle\")'>Seterusnya</button></div>";
  return html;
}

function renderAngle(){
  const angles = anglesForProduct(state.product.id);
  let html = brandBar()+"<div class='screen'>";
  html += "<div class='breadcrumb'>"+esc(state.product.nameMalay)+"</div>";
  html += "<div class='headline'>Video macam mana yang anda nak buat?</div><div class='subline'>Pilih sudut marketing yang sesuai.</div>";
  html += "<div class='card-grid two-col'>";
  angles.forEach(a=>{
    const sel = state.angle && state.angle.id===a.id ? " selected":"";
    html += "<div class='card"+sel+"' onclick='selectAngle(\""+a.id+"\")'><h3>"+esc(a.labelMalay)+"</h3></div>";
  });
  html += "</div></div>";
  html += "<div class='cta-bar'><button class='btn-back' onclick='go(\"product\")'>&larr; Kembali</button>"+
    "<button class='btn-primary' "+(state.angle?"":"disabled")+" onclick='go(\"scenario\")' style='margin-top:10px;'>Seterusnya</button></div>";
  return html;
}

function renderScenario(){
  const scenarios = scenariosForAngle(state.angle.id);
  let html = brandBar()+"<div class='screen'>";
  html += "<div class='breadcrumb'>"+esc(state.product.nameMalay)+" &rarr; "+esc(state.angle.labelMalay)+"</div>";
  html += "<div class='headline'>Situasi mana yang sesuai dengan content anda?</div>";
  html += "<div class='card-grid'>";
  scenarios.forEach(s=>{
    const sel = state.scenario && state.scenario.id===s.id ? " selected":"";
    html += "<div class='card"+sel+"' onclick='selectScenario(\""+s.id+"\")'><h3>"+esc(s.titleMalay)+"</h3></div>";
  });
  html += "</div></div>";
  html += "<div class='cta-bar'><button class='btn-back' onclick='go(\"angle\")'>&larr; Kembali</button>"+
    "<button class='btn-primary' "+(state.scenario?"":"disabled")+" onclick='go(\"style\")' style='margin-top:10px;'>Seterusnya</button></div>";
  return html;
}

function renderStyle(){
  let html = brandBar()+"<div class='screen'>";
  html += "<div class='breadcrumb'>"+esc(state.scenario.titleMalay)+"</div>";
  html += "<div class='headline'>Pilih Gaya Video</div>";
  html += "<div class='card-grid'>";
  STYLES.forEach(s=>{
    const sel = state.style && state.style.id===s.id ? " selected":"";
    html += "<div class='card"+sel+"' onclick='selectStyle(\""+s.id+"\")'><h3>"+esc(s.labelMalay)+"</h3><p>"+esc(s.descMalay)+"</p></div>";
  });
  html += "</div></div>";
  html += "<div class='cta-bar'><button class='btn-back' onclick='go(\"scenario\")'>&larr; Kembali</button>"+
    "<button class='btn-primary' "+(state.style?"":"disabled")+" onclick='go(\"character\")' style='margin-top:10px;'>Seterusnya</button></div>";
  return html;
}

function renderCharacter(){
  let html = brandBar()+"<div class='screen'>";
  html += "<div class='headline'>Siapa dalam video?</div><div class='subline'>Boleh guna watak default, atau ubah suai sikit.</div>";
  html += "<div class='toggle-row'>"+
    "<div class='toggle-btn"+(state.useDefaultCharacter?" active":"")+"' onclick='setUseDefault(true)'>Guna Watak Default</div>"+
    "<div class='toggle-btn"+(!state.useDefaultCharacter?" active":"")+"' onclick='setUseDefault(false)'>Ubah Suai</div>"+
    "</div>";
  if(!state.useDefaultCharacter){
    html += fieldSelect("Umur","ageRange",CHAR_OPTIONS.ageRange);
    html += fieldSelect("Penampilan","appearance",CHAR_OPTIONS.appearance);
    html += fieldSelect("Pakaian","clothing",CHAR_OPTIONS.clothing);
  } else {
    html += "<div class='section-note'>Watak default: "+esc(CHARACTER_DEFAULT.ageRange)+" "+esc(CHARACTER_DEFAULT.appearance)+", "+esc(CHARACTER_DEFAULT.clothing)+".</div>";
  }
  html += "</div>";
  html += "<div class='cta-bar'><button class='btn-back' onclick='go(\"style\")'>&larr; Kembali</button>"+
    "<button class='btn-primary' onclick='generate()' style='margin-top:10px;'>Jana Prompt</button></div>";
  return html;
}

function fieldSelect(label, key, options){
  let html = "<div class='field'><label>"+label+"</label><select onchange='updateCharacter(\""+key+"\", this.value)'>";
  options.forEach(o=>{
    const sel = state.character[key]===o ? " selected":"";
    html += "<option value='"+esc(o)+"'"+sel+">"+esc(o)+"</option>";
  });
  html += "</select></div>";
  return html;
}

function renderGenerating(){
  return "<div class='welcome-hero'><div class='headline'>Sedang jana prompt anda...</div>"+
    "<div class='subline'>Watak, produk dan 5 scene sedang disusun.</div></div>";
}

function promptBlock(title, explainMalay, text, key){
  return "<div class='prompt-block'>"+
    "<div class='prompt-title'>"+esc(title)+"</div>"+
    "<div class='prompt-explain'>"+esc(explainMalay)+"</div>"+
    "<pre class='prompt-text' id='ptext-"+key+"'>"+esc(text)+"</pre>"+
    "<button class='copy-btn' onclick='copyBlock(\"ptext-"+key+"\", this)'>Copy Prompt</button>"+
    "</div>";
}

function renderResult(){
  const p = state.product, sc = state.scenario, st = state.style, ch = state.character;
  const charRef = characterRefText(ch);
  const prodRef = productRefText(p);
  const beats = sc.beats;
  const firstScene = firstSceneImagePrompt(charRef, prodRef, beats[0], st);
  const fullScene = fullSceneReferencePrompt(charRef, prodRef, beats, st);
  const sceneImages = beats.map((b,i)=>sceneImagePrompt(i+1, charRef, prodRef, b, st));
  const combinedVideo = combinedVideoPrompt(beats, st, ch);
  const labels = STRUCTURE_LABELS[sc.structureTemplate];

  let html = "<div class='brandbar'><div class='brand'>Inai Republic</div></div>";
  html += "<div class='screen' style='padding-top:6px;'>";
  html += "<div class='headline' style='font-size:22px;'>Prompt Anda Dah Siap</div>";
  html += "<div class='breadcrumb'>"+esc(p.nameMalay)+" &rarr; "+esc(state.angle.labelMalay)+" &rarr; "+esc(sc.titleMalay)+" &rarr; "+esc(st.labelMalay)+"</div>";

  const tabs = [["idea","IDEA"],["watak","WATAK"],["rujukan","RUJUKAN"],["gambar","PROMPT GAMBAR"],["video","PROMPT VIDEO"]];
  html += "<div class='tabs'>";
  tabs.forEach(t=>{
    html += "<div class='tab"+(state.activeTab===t[0]?" active":"")+"' onclick='setTab(\""+t[0]+"\")'>"+t[1]+"</div>";
  });
  html += "</div>";

  html += "<div style='padding:14px 0;'>";

  if(state.activeTab==="idea"){
    html += "<div class='prompt-block'><div class='prompt-title'>"+esc(sc.titleMalay)+"</div>"+
      "<div class='prompt-explain'>Produk: "+esc(p.nameMalay)+". Sudut marketing: "+esc(state.angle.labelMalay)+". Gaya video: "+esc(st.labelMalay)+".</div>"+
      "<div class='prompt-explain'>Sudut ini fokus kepada situasi yang rasa dekat dengan pengalaman harian pelanggan, bukan macam iklan biasa - content jenis ni biasanya lebih senang buat orang stop scroll dan percaya.</div>"+
      "<div class='prompt-explain'>Struktur video: "+labels.join(" -> ")+" (5 scene, ~2 saat setiap satu, 10 saat keseluruhan).</div>"+
      "</div>";
  }

  if(state.activeTab==="watak"){
    html += "<div class='prompt-block'><div class='prompt-title'>Watak Dalam Video</div>"+
      "<div class='prompt-explain'>"+esc(ch.ageRange)+" "+esc(ch.appearance)+", "+esc(ch.hairstyle)+", pakai "+esc(ch.clothing)+". Watak ni akan kekal sama dalam semua scene.</div></div>";
    html += promptBlock("Rujukan Watak", "Guna prompt ini untuk menghasilkan gambar rujukan watak.", charRef, "charref");
  }

  if(state.activeTab==="rujukan"){
    html += "<div class='prompt-block'><div class='prompt-title'>Peraturan Produk</div>"+
      "<div class='prompt-explain'>Peraturan ini memastikan produk kekal sama seperti gambar asal dalam setiap scene.</div>"+
      "<pre class='prompt-text' id='ptext-rule-product'>"+esc(PRODUCT_LOCK_RULE)+"</pre>"+
      "<button class='copy-btn' onclick='copyBlock(\"ptext-rule-product\", this)'>Copy Prompt</button></div>";
    html += "<div class='prompt-block'><div class='prompt-title'>Peraturan Watak</div>"+
      "<div class='prompt-explain'>Peraturan ini memastikan watak kekal sama dari scene pertama sampai scene terakhir.</div>"+
      "<pre class='prompt-text' id='ptext-rule-character'>"+esc(CHARACTER_LOCK_RULE)+"</pre>"+
      "<button class='copy-btn' onclick='copyBlock(\"ptext-rule-character\", this)'>Copy Prompt</button></div>";
    html += "<div class='prompt-block'><div class='prompt-title'>Peraturan Tanpa Teks</div>"+
      "<div class='prompt-explain'>Video tidak boleh ada subtitle, caption atau teks tambahan - kecuali teks asli pada packaging produk.</div>"+
      "<pre class='prompt-text' id='ptext-rule-notext'>"+esc(NO_TEXT_RULE)+"</pre>"+
      "<button class='copy-btn' onclick='copyBlock(\"ptext-rule-notext\", this)'>Copy Prompt</button></div>";
  }

  if(state.activeTab==="gambar"){
    html += promptBlock("Rujukan Watak", "Gunakan prompt ini untuk menghasilkan gambar rujukan watak.", charRef, "g-charref");
    html += promptBlock("Rujukan Produk", "Gunakan prompt ini untuk memastikan produk kekal tepat seperti asal.", prodRef, "g-prodref");
    html += promptBlock("Rujukan Scene Pertama", "Gunakan prompt ini untuk mengunci pencahayaan dan suasana sebelum scene 1-5.", firstScene, "g-first");
    html += promptBlock("Rujukan Keseluruhan Scene", "Gambaran keseluruhan 5 scene sebagai semakan sebelum jana satu-satu.", fullScene, "g-full");
    sceneImages.forEach((txt,i)=>{
      html += promptBlock("Scene "+(i+1)+" - Prompt Gambar", "Gunakan prompt ini untuk menghasilkan gambar rujukan bagi Scene "+(i+1)+" ("+labels[i]+").", txt, "g-scene"+(i+1));
    });
  }

  if(state.activeTab==="video"){
    const dialogueLines = beats.map((b,i)=> (b.dialogue && b.dialogue.hasDialogue) ? ("Scene "+(i+1)+" ("+b.dialogue.speaker+"): "+b.dialogue.lineMalay) : null).filter(Boolean);
    html += "<div class='prompt-block'><div class='prompt-title'>Prompt Video (5 Scene Dalam 1)</div>"+
      "<div class='prompt-explain'>Prompt ini merangkumi kelima-lima scene dalam SATU video 10 saat - terus paste dalam AI video tool anda, tak perlu jana satu-satu.</div>";
    if(dialogueLines.length){
      html += "<div class='dialogue-preview'><b>Dialog dalam video ni:</b><br>"+dialogueLines.map(esc).join("<br>")+"</div>";
    }
    html += "<pre class='prompt-text' id='ptext-video'>"+esc(combinedVideo)+"</pre>"+
      "<button class='copy-btn' onclick='copyBlock(\"ptext-video\", this)'>Copy Prompt</button></div>";
  }

  html += "</div></div>";
  html += "<div class='cta-bar'><button class='btn-primary' onclick='resetApp()'>Cipta Idea Baharu</button></div>";
  return html;
}

/* ==================== NAVIGATION & ACTIONS ==================== */
function go(screen){ state.screen = screen; render(); }
function selectProduct(id){ state.product = PRODUCTS.find(p=>p.id===id); state.angle=null; state.scenario=null; render(); }
function selectAngle(id){ state.angle = ANGLES.find(a=>a.id===id); state.scenario=null; render(); }
function selectScenario(id){ state.scenario = SCENARIOS.find(s=>s.id===id); render(); }
function selectStyle(id){ state.style = STYLES.find(s=>s.id===id); render(); }
function setUseDefault(val){
  state.useDefaultCharacter = val;
  state.character = val ? Object.assign({}, CHARACTER_DEFAULT) : Object.assign({}, state.character);
  render();
}
function updateCharacter(key, val){ state.character[key] = val; }
function setTab(tab){ state.activeTab = tab; render(); }
function generate(){
  state.screen = "generating";
  render();
  setTimeout(()=>{ state.screen = "result"; state.activeTab="idea"; render(); }, 700);
}
function resetApp(){
  state = { screen:"welcome", product:null, angle:null, scenario:null, style:null, character:Object.assign({}, CHARACTER_DEFAULT), useDefaultCharacter:true, activeTab:"idea" };
  render();
}
function copyBlock(elId, btn){
  const el = document.getElementById(elId);
  const text = el.innerText;
  const original = btn.textContent;
  function showCopied(){
    btn.textContent = "Copied!";
    btn.classList.add("copied");
    setTimeout(()=>{ btn.textContent = original; btn.classList.remove("copied"); }, 1500);
  }
  function fallbackCopy(){
    try{
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      ta.style.top = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      if(ok){ showCopied(); } else { btn.textContent = "Sila salin manual"; setTimeout(()=>{btn.textContent=original;},1500); }
    }catch(e){
      btn.textContent = "Sila salin manual";
      setTimeout(()=>{btn.textContent=original;},1500);
    }
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(showCopied).catch(fallbackCopy);
  } else {
    fallbackCopy();
  }
}

/* ==================== RENDER DISPATCH ==================== */
function render(){
  const app = document.getElementById("app");
  let html = "";
  switch(state.screen){
    case "welcome": html = renderWelcome(); break;
    case "product": html = renderProduct(); break;
    case "angle": html = renderAngle(); break;
    case "scenario": html = renderScenario(); break;
    case "style": html = renderStyle(); break;
    case "character": html = renderCharacter(); break;
    case "generating": html = renderGenerating(); break;
    case "result": html = renderResult(); break;
  }
  app.innerHTML = html;
}
render();
</script>
