<style>
:root{
  --maroon:#6E1423;
  --maroon-dark:#4E0D18;
  --cream:#FAF3E8;
  --gold:#C9A24B;
  --ink:#2B1210;
  --blush:#E8D5CE;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--maroon-dark);
  font-family:'Plus Jakarta Sans',sans-serif;
  color:var(--ink);
}
#app{
  max-width:480px;
  margin:0 auto;
  min-height:100vh;
  background:var(--cream);
  position:relative;
  padding-bottom:100px;
  box-shadow:0 0 60px rgba(0,0,0,0.35);
  overflow-x:hidden;
}
.brandbar{
  padding:16px 0 8px;
  text-align:center;
  background:linear-gradient(180deg,var(--maroon) 0%, var(--maroon) 60%, var(--cream) 100%);
  padding-bottom:26px;
  margin-bottom:-16px;
}
.brand{
  font-family:'Fraunces',serif;
  font-size:13px;
  letter-spacing:3px;
  color:var(--gold);
  text-transform:uppercase;
}
.rail{display:flex;justify-content:center;align-items:center;gap:16px;padding:14px 0 4px;}
.rail-step{display:flex;flex-direction:column;align-items:center;gap:5px;}
.diamond{width:11px;height:11px;background:rgba(255,255,255,0.25);transform:rotate(45deg);border:1px solid var(--gold);}
.diamond.filled{background:var(--gold);}
.diamond.current{background:var(--cream);border:2px solid var(--gold);}
.rail-label{font-size:9px;color:rgba(255,255,255,0.75);letter-spacing:.5px;}
.screen{padding:14px 22px 20px;}
.eyebrow{font-size:12px;color:var(--maroon);opacity:.75;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;}
.headline{font-family:'Fraunces',serif;font-size:27px;color:var(--maroon);margin:0 0 8px;line-height:1.25;font-weight:700;}
.subline{font-size:15px;color:var(--ink);opacity:.8;margin-bottom:22px;line-height:1.5;}
.card-grid{display:grid;gap:12px;}
.card-grid.two-col{grid-template-columns:1fr 1fr;}
.card{
  background:#fff;
  border:2px solid var(--blush);
  border-radius:14px;
  padding:16px;
  cursor:pointer;
  transition:.15s;
  text-align:left;
}
.card:active{transform:scale(0.98);}
.card.selected{border-color:var(--maroon);background:#fff6ee;}
.card h3{font-family:'Fraunces',serif;margin:0 0 4px;font-size:17px;color:var(--maroon);font-weight:600;}
.card p{margin:0;font-size:13px;opacity:.75;line-height:1.4;}
.product-thumb{
  width:100%;height:90px;border-radius:10px;margin-bottom:10px;
  display:flex;align-items:center;justify-content:center;
  font-family:'Fraunces',serif;color:#fff;font-size:13px;letter-spacing:1px;
}
.thumb-kuku{background:linear-gradient(135deg,#7A1A2B,#3E0B14);}
.thumb-henna{background:linear-gradient(135deg,#5B1220,#2A0A10);}
.duration-tag{display:inline-block;background:var(--gold);color:var(--maroon-dark);font-size:11px;font-weight:700;padding:3px 9px;border-radius:10px;margin-top:8px;letter-spacing:.5px;}
.cta-bar{
  position:fixed;bottom:0;left:0;right:0;
  max-width:480px;margin:0 auto;
  background:linear-gradient(to top, var(--cream) 65%, transparent);
  padding:22px 22px 24px;
}
.btn-primary{
  width:100%;background:var(--maroon);color:#fff;border:none;
  padding:16px;border-radius:12px;font-size:16px;font-weight:600;
  font-family:'Plus Jakarta Sans',sans-serif;
}
.btn-primary:disabled{opacity:.35;}
.btn-back{
  background:none;border:none;color:var(--maroon);
  font-size:14px;font-weight:600;padding:6px 0 0;cursor:pointer;
}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:14px 22px 4px;-webkit-overflow-scrolling:touch;}
.tab{
  flex:0 0 auto;padding:9px 15px;border-radius:20px;
  background:var(--blush);font-size:13px;font-weight:600;
  white-space:nowrap;cursor:pointer;color:var(--maroon-dark);
}
.tab.active{background:var(--maroon);color:#fff;}
.prompt-block{
  background:#fff;border:1px solid var(--blush);border-radius:12px;
  padding:14px;margin-bottom:14px;
}
.prompt-title{font-family:'Fraunces',serif;color:var(--maroon);font-size:15px;margin-bottom:4px;font-weight:600;}
.prompt-explain{font-size:13px;opacity:.75;margin-bottom:10px;line-height:1.4;}
.prompt-text{
  font-family:'IBM Plex Mono',monospace;font-size:12px;white-space:pre-wrap;
  background:var(--cream);border-radius:8px;padding:10px;
  max-height:220px;overflow-y:auto;margin:0 0 10px;line-height:1.5;
}
.copy-btn{
  background:var(--gold);border:none;color:var(--maroon-dark);
  padding:9px 16px;border-radius:20px;font-size:13px;font-weight:700;cursor:pointer;
}
.copy-btn.copied{background:var(--maroon);color:#fff;}
.dialogue-preview{background:var(--blush);border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:10px;}
.dialogue-preview b{color:var(--maroon);}
.field{margin-bottom:16px;}
.field label{display:block;font-size:13px;font-weight:600;color:var(--maroon);margin-bottom:6px;}
.field select{
  width:100%;padding:12px;border-radius:10px;border:2px solid var(--blush);
  font-family:'Plus Jakarta Sans',sans-serif;font-size:14px;background:#fff;color:var(--ink);
}
.toggle-row{display:flex;gap:10px;margin-bottom:18px;}
.toggle-btn{
  flex:1;padding:12px;border-radius:10px;border:2px solid var(--blush);
  background:#fff;text-align:center;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink);
}
.toggle-btn.active{border-color:var(--maroon);background:#fff6ee;color:var(--maroon);}
.breadcrumb{font-size:12px;color:var(--maroon);opacity:.7;margin-bottom:10px;}
.welcome-hero{padding:40px 22px 10px;text-align:center;}
.welcome-hero .headline{font-size:32px;}
.section-note{font-size:12px;color:var(--maroon);opacity:.7;margin:4px 0 16px;font-style:italic;}
</style>
</head>

/* ==================== HELPERS: product-conditional beat resolution ==================== */
function resolveAction(action, productId){
  return (typeof action === "string") ? action : action[productId];
}
function resolveBeats(beats, productId){
  return beats.map(function(b){
    const resolved = Object.assign({}, b, {action: resolveAction(b.action, productId)});
    if(b.dialogue && b.dialogue.hasDialogue && typeof b.dialogue.lineMalay !== "string"){
      resolved.dialogue = Object.assign({}, b.dialogue, {lineMalay: resolveAction(b.dialogue.lineMalay, productId)});
    }
    return resolved;
  });
}

function characterRefText(c){
  const app = c.appearance.toLowerCase();
  const wearsHijab = app.indexOf("hijab") !== -1 && app.indexOf("not wearing") === -1;
  const hairClause = wearsHijab ? "wearing a neatly styled hijab with no hair visible" : c.hairstyle;
  const hijabNote = wearsHijab
    ? "This character wears a hijab - the hijab must be present in every single scene without exception, and no hair may become visible at any point."
    : "This character does not wear a hijab - hair must stay uncovered and visible in every single scene without exception.";
  return "Reference character: a "+c.ageRange+" "+c.appearance+", "+hairClause+", "+c.skinTone+" skin tone, wearing "+c.clothing+", "+c.makeup+" makeup, "+c.expression+" expression. "+hijabNote+" This exact character must be used consistently in every following image and video.";
}
function productRefText(p){
  return "Product reference: "+p.packagingLock+"\n"+PRODUCT_LOCK_RULE+"\n"+p.applicationRule;

function styleLine(s){
  return "Style: "+s.mood+", lighting: "+s.lighting+", camera: "+s.camera;

  "Link kat beg kuning tu, order terus",
  "Jom klik beg kuning sebelum harga naik balik",
  "Stock terhad jangan tunggu esok",
  "Harga ni tak selalu ada jom grab sekarang"
];
function pickCtaLine(id){
  let hash = 0;
  for(let i=0;i<id.length;i++){ hash = (hash*31 + id.charCodeAt(i)) >>> 0; }
  return CTA_LINES[hash % CTA_LINES.length];
}

function combinedVideoPrompt(beats, style, character, product){
  const sceneLines = beats.map(function(b,i){
    let line = "Scene "+(i+1)+" ("+b.purpose+", ~2s): "+b.action+".";
    if(b.dialogue && b.dialogue.hasDialogue){
      line += " The "+b.dialogue.speaker+" says naturally in Malay: "+b.dialogue.lineMalay+".";
    }
    return line;
  }).join("\n");
  return "Subject: character as referenced, product as referenced.\nCreate one continuous 10-second vertical short-form video made of 5 sequential scenes, approximately 2 seconds each:\n"+sceneLines+"\nCamera: "+style.camera+", framing appropriate to a vertical short-form video.\nLighting: "+style.lighting+".\nFacial expression / body movement: natural, consistent with "+character.expression+" expression throughout.\nContinuity: identical character and product appearance across all 5 scenes.\n"+PRODUCT_LOCK_RULE+"\n"+CHARACTER_LOCK_RULE+"\n"+NO_TEXT_RULE+"\n"+product.applicationRule+"\n"+SPEAKER_ATTRIBUTION_RULE;
}
function continuationVideoPrompt(beats, style, character, sceneOffset, product, contextId){
  const sceneLines = beats.map(function(b,i){
    let line = "Scene "+(sceneOffset+i+1)+" ("+b.purpose+", ~2s): "+b.action+".";
    if(b.dialogue && b.dialogue.hasDialogue){
      line += " The "+b.dialogue.speaker+" says naturally in Malay: "+b.dialogue.lineMalay+".";
    }
    return line;
  }).join("\n");
  const ctaLine = pickCtaLine(contextId);
  const lastScene = sceneOffset+beats.length;
  return "This is the SECOND 10-second half of a longer 20-second video. Continue directly from the same character, product, and setting established in the first half - do not restart, re-introduce, or repeat the opening.\nSubject: character as referenced, product as referenced.\nContinue with 5 more sequential scenes, approximately 2 seconds each, building toward a clear, satisfying ending:\n"+sceneLines+"\nMandatory closing CTA: in the final 1-2 seconds of Scene "+lastScene+", the main character turns to speak directly to camera, breaking from the scene, and says naturally in Malay: "+ctaLine+".\nCamera: "+style.camera+", framing appropriate to a vertical short-form video.\nLighting: "+style.lighting+".\nFacial expression / body movement: natural, consistent with "+character.expression+" expression throughout.\nContinuity: identical character and product appearance, continuing seamlessly from the first 10 seconds.\n"+PRODUCT_LOCK_RULE+"\n"+CHARACTER_LOCK_RULE+"\n"+NO_TEXT_RULE+"\n"+product.applicationRule+"\n"+SPEAKER_ATTRIBUTION_RULE;
}

function esc(str){
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function renderRail(){
  const idx = railIndexForScreen();
  if(idx===undefined) return "";
  const steps = state.mode==="movie" ? RAIL_STEPS_MOVIE : RAIL_STEPS_MARKETING;
  let html = "<div class='rail'>";
  steps.forEach((label,i)=>{
    let cls = "diamond";
    if(i<idx) cls += " filled";
    if(i===idx) cls += " current";
    html += "<div class='rail-step'><div class='"+cls+"'></div><div class='rail-label'>"+label+"</div></div>";
  });
  html += "</div>";
  return html;
}

function go(screen){ state.screen = screen; render(); }
function selectProduct(id){ state.product = PRODUCTS.find(p=>p.id===id); state.angle=null; state.scenario=null; state.genre=null; render(); }
function selectAngle(id){ state.angle = ANGLES.find(a=>a.id===id); state.scenario=null; render(); }
function selectScenario(id){ state.scenario = SCENARIOS.find(s=>s.id===id); render(); }
function selectStyle(id){ state.style = STYLES.find(s=>s.id===id); render(); }
function setUseDefault(val){
  state.useDefaultCharacter = val;
  state.character = val ? Object.assign({}, CHARACTER_DEFAULT) : Object.assign({}, state.character);
  render();
}
function updateCharacter(key, val){ state.character[key] = val; }
function setTab(tab){ state.activeTab = tab; render(); }
function generate(){
  state.screen = "generating";
  render();
  setTimeout(()=>{ state.screen = "result"; state.activeTab="idea"; render(); }, 700);
}
function resetApp(){
  state = { screen:"welcome", product:null, mode:"marketing", angle:null, scenario:null, style:null, genre:null, character:Object.assign({}, CHARACTER_DEFAULT), useDefaultCharacter:true, activeTab:"idea" };
  render();
}
function copyBlock(elId, btn){
  const el = document.getElementById(elId);
  const text = el.innerText;
  const original = btn.textContent;
  function showCopied(){
    btn.textContent = "Copied!";
    btn.classList.add("copied");
    setTimeout(()=>{ btn.textContent = original; btn.classList.remove("copied"); }, 1500);
  }
  function fallbackCopy(){
    try{
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      ta.style.top = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      if(ok){ showCopied(); } else { btn.textContent = "Sila salin manual"; setTimeout(()=>{btn.textContent=original;},1500); }
    }catch(e){
      btn.textContent = "Sila salin manual";
      setTimeout(()=>{btn.textContent=original;},1500);
    }
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(showCopied).catch(fallbackCopy);
  } else {
    fallbackCopy();
  }
}

/* ==================== RENDER DISPATCH ==================== */
function render(){
  const app = document.getElementById("app");
  let html = "";
  switch(state.screen){
    case "welcome": html = renderWelcome(); break;
    case "product": html = renderProduct(); break;
    case "mode": html = renderMode(); break;
    case "genre": html = renderGenre(); break;
    case "angle": html = renderAngle(); break;
    case "scenario": html = renderScenario(); break;
    case "style": html = renderStyle(); break;
    case "character": html = renderCharacter(); break;
    case "generating": html = renderGenerating(); break;
    case "result": html = renderResult(); break;
  }
  app.innerHTML = html;
}
render();
</script>
